name: Cortex CI/CD

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CortexBackend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet publish --no-build --configuration Release -o ./out

      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: CortexBackend/out

  docker-backend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build backend Docker image
        run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cortex-backend:${{ github.sha }} ./CortexBackend

      - name: Push backend Docker image
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/cortex-backend:${{ github.sha }}

  deploy-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker-backend

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend
        run: |
          az containerapp update \
            --name cortex-backend \
            --resource-group Cortex \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/cortex-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CortexFrontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CortexFrontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: CortexFrontend/dist

  docker-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://cortex-backend.purplestone-9d3b07f5.eastus.azurecontainerapps.io/api \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/cortex-frontend:${{ github.sha }} ./CortexFrontend

      - name: Push frontend Docker image
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/cortex-frontend:${{ github.sha }}

  deploy-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker-frontend

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name cortex-frontend \
            --resource-group Cortex \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/cortex-frontend:${{ github.sha }}
